[project]
name = "multimodal-decision-data"
version = "0.1.0"
description = "Verified multimodal decision data and native Qwen training"
requires-python = ">=3.12"
dependencies = ["Pillow==12.3.0", "pyarrow==21.0.0"]


[project.optional-dependencies]
processor = ["transformers==5.19.0", "torch==2.14.1", "torchvision==0.29.1", "numpy==2.5.4", "huggingface-hub==2.2.0"]
training = ["multimodal-decision-data[processor]", "peft>=0.17,<1", "accelerate>=1.10,<2", "safetensors==0.8.0", "psutil>=6,<8"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdprep", "src/mdtrain"]
